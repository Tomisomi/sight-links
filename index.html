<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Моя Linktree-страница</title>
    <style>
      :root {
        --bg-1: #1b1b3a;
        --bg-2: #4f46e5;
        --bg-3: #06b6d4;
        --card: rgba(255, 255, 255, 0.12);
        --text: #f8fafc;
        --muted: #cbd5e1;
        --shadow: 0 15px 40px rgba(5, 8, 22, 0.45);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.2), transparent 25%),
          radial-gradient(circle at 80% 0%, rgba(255, 255, 255, 0.16), transparent 30%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2) 45%, var(--bg-3));
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
      }

      .card {
        width: min(100%, 420px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 28px;
        background: var(--card);
        backdrop-filter: blur(16px);
        box-shadow: var(--shadow);
        padding: 2.2rem 1.2rem 1.4rem;
      }

      .profile {
        text-align: center;
        margin-bottom: 1.4rem;
      }

      .avatar {
        width: 96px;
        height: 96px;
        margin: 0 auto 0.85rem;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 2.2rem;
        font-weight: 700;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.35));
        color: #0f172a;
        box-shadow: 0 10px 20px rgba(2, 6, 23, 0.35);
      }

      h1 {
        font-size: 1.6rem;
        margin-bottom: 0.35rem;
      }

      .bio {
        color: var(--muted);
        font-size: 0.95rem;
      }

      .links {
        list-style: none;
        display: grid;
        gap: 0.8rem;
      }

      .link {
        text-decoration: none;
        color: var(--text);
        background: rgba(255, 255, 255, 0.17);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.95rem 1rem;
        transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
      }

      .link:hover,
      .link:focus-visible {
        transform: translateY(-3px) scale(1.01);
        background: rgba(255, 255, 255, 0.26);
        border-color: rgba(255, 255, 255, 0.5);
        outline: none;
      }

      .link-title {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        font-weight: 600;
      }

      .badge {
        font-size: 1.1rem;
      }

      footer {
        margin-top: 1.2rem;
        text-align: center;
        color: rgba(248, 250, 252, 0.75);
        font-size: 0.8rem;
      }

      @media (max-width: 420px) {
        .card {
          border-radius: 22px;
          padding: 1.9rem 1rem 1.2rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <section class="profile">
        <div class="avatar">SL</div>
        <h1>@sight-links</h1>
        <p class="bio">Делюсь проектами, мыслями и полезными ссылками ✨</p>
      </section>

      <ul class="links">
        <li>
          <a class="link" href="https://t.me" target="_blank" rel="noopener noreferrer">
            <span class="link-title"><span class="badge">💬</span> Telegram</span>
            <span>→</span>
          </a>
        </li>
        <li>
          <a class="link" href="https://github.com" target="_blank" rel="noopener noreferrer">
            <span class="link-title"><span class="badge">🧑‍💻</span> GitHub</span>
            <span>→</span>
          </a>
        </li>
        <li>
          <a class="link" href="https://www.youtube.com" target="_blank" rel="noopener noreferrer">
            <span class="link-title"><span class="badge">🎬</span> YouTube</span>
            <span>→</span>
          </a>
        </li>
        <li>
          <a class="link" href="mailto:hello@example.com">
            <span class="link-title"><span class="badge">📩</span> Связаться</span>
            <span>→</span>
          </a>
        </li>
      </ul>

      <footer>Сделано с любовью · 2026</footer>
    </main>
  </body>
</html>
