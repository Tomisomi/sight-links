<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Моя страница ссылок</title>
    <style>
      :root {
        --bg: #0f0f10;
        --card: #171718;
        --line: #2d2d2f;
        --text: #f5f5f5;
        --muted: #b8b8bd;
        --button: #242427;
        --button-hover: #2f2f33;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(180deg, #0a0a0b 0%, #131315 100%);
        color: var(--text);
        font-family: "Georgia", "Times New Roman", serif;
        display: grid;
        place-items: center;
        padding: 24px 16px;
      }

      .card {
        width: min(100%, 420px);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
        padding: 28px 16px 18px;
      }

      .profile {
        text-align: center;
        margin-bottom: 18px;
      }

      .avatar {
        width: 84px;
        height: 84px;
        margin: 0 auto 12px;
        border-radius: 50%;
        border: 1px solid #3a3a3d;
        background: radial-gradient(circle at 30% 30%, #f0f0f0 0%, #bcbcc1 35%, #63636a 100%);
        color: #111;
        display: grid;
        place-items: center;
        font-size: 28px;
        font-weight: 700;
      }

      h1 {
        font-size: 1.5rem;
        letter-spacing: 0.4px;
        margin-bottom: 6px;
      }

      .bio {
        color: var(--muted);
        font-size: 0.95rem;
      }

      .links {
        list-style: none;
        display: grid;
        gap: 10px;
      }

      .link {
        display: flex;
        justify-content: space-between;
        align-items: center;
        text-decoration: none;
        color: var(--text);
        background: var(--button);
        border: 1px solid #3a3a3d;
        border-radius: 10px;
        padding: 13px 14px;
        transition: background-color 0.16s ease, transform 0.16s ease;
      }

      .link:hover,
      .link:focus-visible {
        background: var(--button-hover);
        transform: translateY(-2px);
        outline: none;
      }

      .left {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 1rem;
      }

      .icon {
        width: 24px;
        text-align: center;
      }

      footer {
        margin-top: 14px;
        text-align: center;
        color: #8d8d92;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <section class="profile">
        <div class="avatar">SL</div>
        <h1>@sight-links</h1>
        <p class="bio">Классическая страница ссылок</p>
      </section>

      <ul class="links">
        <li>
          <a class="link" href="https://vimeo.com" target="_blank" rel="noopener noreferrer">
            <span class="left"><span class="icon">🎞️</span> Vimeo</span>
            <span>→</span>
          </a>
        </li>
        <li>
          <a class="link" href="https://facebook.com" target="_blank" rel="noopener noreferrer">
            <span class="left"><span class="icon">📘</span> Facebook</span>
            <span>→</span>
          </a>
        </li>
        <li>
          <a class="link" href="https://instagram.com" target="_blank" rel="noopener noreferrer">
            <span class="left"><span class="icon">📷</span> Instagram</span>
            <span>→</span>
          </a>
        </li>
        <li>
          <a class="link" href="mailto:hello@example.com">
            <span class="left"><span class="icon">✉️</span> Email</span>
            <span>→</span>
          </a>
        </li>
        <li>
          <a class="link" href="https://example.com" target="_blank" rel="noopener noreferrer">
            <span class="left"><span class="icon">🌐</span> Сайт</span>
            <span>→</span>
          </a>
        </li>
      </ul>

      <footer>Black · White · Gray</footer>
    </main>
  </body>
</html>
